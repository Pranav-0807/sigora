{% extends "base.html" %}
{% block content %}
<div class="form-page">
    <div class="form-page-header"><span class="eyebrow">MONEY MOVEMENT</span><h1>Add transaction</h1><p>Record it once. Sigora handles the rest.</p></div>
    {% if error %}<div class="settings-message error">{{ error }}</div>{% endif %}
    <form method="POST" class="modern-form-card">
        <label>Transaction type<select name="transaction_type"><option value="income">Income</option><option value="expense" selected>Expense</option></select></label>
        <label>Amount<input type="number" name="amount" step="0.01" min="0.01" required></label>
        <label>Category <span class="field-hint">Leave as Auto to let Sigora decide</span><input type="text" name="category" placeholder="Auto-categorize"></label>
        <label>Description<input type="text" name="description" placeholder="e.g. Swiggy, salary, rent" required></label>
        <label>Date<input type="date" name="date" required></label>
        <label>{{ t('Payment account') }} <span class="field-hint">{{ t('Choose the account this money moved through.') }}</span><select name="financial_account_id"><option value="">{{ t('Cash / unassigned') }}</option>{% for a in accounts %}<option value="{{ a.id }}">{{ a.account_name or a.institution_name }} · {{ a.institution_name }}{% if a.masked_account %} · •••• {{ a.masked_account[-4:] }}{% endif %}</option>{% endfor %}</select></label>
        <div class="form-actions"><button class="hero-button" type="submit">Add transaction</button><a class="secondary-button" href="/transactions">Cancel</a></div>
    </form>
</div>
{% endblock %}
