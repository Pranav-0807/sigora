{% extends "base.html" %}
{% block content %}
<div class="auth-screen">
    <div class="auth-card-modern">
        <div class="auth-brand-mark">S</div>
        <span class="eyebrow">ACCOUNT RECOVERY</span>
        <h1>Reset your password.</h1>
        <p class="auth-subtitle">Enter the email linked to your Sigora account. We'll send a secure, single-use reset link that expires in 30 minutes.</p>
        {% if message %}<div class="auth-success">{{ message }}</div>{% endif %}
        <form method="POST" class="auth-form">
            <label for="email">Email</label>
            <input id="email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
            <button type="submit" class="auth-submit">Send reset link <span>→</span></button>
        </form>
        <p class="auth-switch"><a href="/login">← Back to login</a></p>
    </div>
</div>
{% endblock %}
