{% extends "base.html" %}

{% block content %}

<div class="goal-form-page">

    <div class="goal-form-header">

        <div class="page-eyebrow">
            SPENDING CONTROL
        </div>

        <h1>Create a Budget</h1>

        <p>
            Set a spending limit and keep your money on track.
        </p>

    </div>


    <div class="goal-form-card">

        {% if error %}
            <div class="form-error">
                {{ error }}
            </div>
        {% endif %}


        <form method="POST">

            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <input
                    type="text"
                    id="category"
                    name="category"
                    placeholder="e.g. Food, Shopping, Transport"
                    required
                >

            </div>


            <div class="form-group">

                <label for="amount">
                    Monthly Budget
                </label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    placeholder="15000"
                    min="1"
                    step="0.01"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="month">
                        Month
                    </label>

                    <select
                        id="month"
                        name="month"
                        required
                    >
                        <option value="1" {% if current_month == 1 %}selected{% endif %}>January</option>
                        <option value="2" {% if current_month == 2 %}selected{% endif %}>February</option>
                        <option value="3" {% if current_month == 3 %}selected{% endif %}>March</option>
                        <option value="4" {% if current_month == 4 %}selected{% endif %}>April</option>
                        <option value="5" {% if current_month == 5 %}selected{% endif %}>May</option>
                        <option value="6" {% if current_month == 6 %}selected{% endif %}>June</option>
                        <option value="7" {% if current_month == 7 %}selected{% endif %}>July</option>
                        <option value="8" {% if current_month == 8 %}selected{% endif %}>August</option>
                        <option value="9" {% if current_month == 9 %}selected{% endif %}>September</option>
                        <option value="10" {% if current_month == 10 %}selected{% endif %}>October</option>
                        <option value="11" {% if current_month == 11 %}selected{% endif %}>November</option>
                        <option value="12" {% if current_month == 12 %}selected{% endif %}>December</option>
                    </select>

                </div>


                <div class="form-group">

                    <label for="year">
                        Year
                    </label>

                    <input
                        type="number"
                        id="year"
                        name="year"
                        value="{{ current_year }}"
                        min="2000"
                        required
                    >

                </div>

            </div>


            <div class="goal-form-actions">

                <a href="/budgets" class="form-cancel">
                    Cancel
                </a>

                <button
                    type="submit"
                    class="hero-button"
                >
                    Create Budget →
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
