{% extends "base.html" %}

{% block content %}

<h2>Edit Transaction</h2>

{% if error %}
    <div class="alert alert-danger">
        {{ error }}
    </div>
{% endif %}

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Transaction Type</label>
        <select name="transaction_type" class="form-control">
            <option value="income"
                {% if transaction["transaction_type"] == "income" %}selected{% endif %}>
                Income
            </option>

            <option value="expense"
                {% if transaction["transaction_type"] == "expense" %}selected{% endif %}>
                Expense
            </option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Amount</label>
        <input type="number"
               name="amount"
               class="form-control"
               value="{{ transaction['amount'] }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Category</label>
        <input type="text"
               name="category"
               class="form-control"
               value="{{ transaction['category'] }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Description</label>
        <input type="text"
               name="description"
               class="form-control"
               value="{{ transaction['description'] }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date"
               name="date"
               class="form-control"
               value="{{ transaction['date'] }}">
    </div>

    <div class="mb-3"><label class="form-label">{{ t('Payment account') }}</label><select name="financial_account_id" class="form-control"><option value="">{{ t('Cash / unassigned') }}</option>{% for a in accounts %}<option value="{{ a.id }}" {% if transaction.financial_account_id == a.id %}selected{% endif %}>{{ a.account_name or a.institution_name }} · {{ a.institution_name }}{% if a.masked_account %} · •••• {{ a.masked_account[-4:] }}{% endif %}</option>{% endfor %}</select></div>

    <button type="submit" class="btn btn-success">
        Save Changes
    </button>

    <a href="/transactions" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
