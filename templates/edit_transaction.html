{% extends "base.html" %}

{% block content %}

<h2>Edit Transaction</h2>

{% if error %}
    <div class="alert alert-danger">
        {{ error }}
    </div>
{% endif %}

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Transaction Type</label>
        <select name="transaction_type" class="form-control">
            <option value="income"
                {% if transaction["transaction_type"] == "income" %}selected{% endif %}>
                Income
            </option>

            <option value="expense"
                {% if transaction["transaction_type"] == "expense" %}selected{% endif %}>
                Expense
            </option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Amount</label>
        <input type="number"
               name="amount"
               class="form-control"
               value="{{ transaction['amount'] }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Category</label>
        <input type="text"
               name="category"
               class="form-control"
               value="{{ transaction['category'] }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Description</label>
        <input type="text"
               name="description"
               class="form-control"
               value="{{ transaction['description'] }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date"
               name="date"
               class="form-control"
               value="{{ transaction['date'] }}">
    </div>

    <button type="submit" class="btn btn-success">
        Save Changes
    </button>

    <a href="/transactions" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
