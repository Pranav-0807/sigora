{% extends "base.html" %}

{% block content %}

<div class="goal-form-page">

    <div class="goal-form-header">

        <div class="page-eyebrow">
            SPENDING CONTROL
        </div>

        <h1>Edit Budget</h1>

        <p>
            Adjust your spending limit as your plans change.
        </p>

    </div>


    <div class="goal-form-card">

        {% if error %}
            <div class="form-error">
                {{ error }}
            </div>
        {% endif %}


        <form method="POST">

            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <input
                    type="text"
                    id="category"
                    name="category"
                    value="{{ budget.category }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="amount">
                    Monthly Budget
                </label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    value="{{ budget.amount }}"
                    min="1"
                    step="0.01"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="month">
                        Month
                    </label>

                    <select
                        id="month"
                        name="month"
                        required
                    >

                        <option value="1" {% if budget.month == 1 %}selected{% endif %}>
                            January
                        </option>

                        <option value="2" {% if budget.month == 2 %}selected{% endif %}>
                            February
                        </option>

                        <option value="3" {% if budget.month == 3 %}selected{% endif %}>
                            March
                        </option>

                        <option value="4" {% if budget.month == 4 %}selected{% endif %}>
                            April
                        </option>

                        <option value="5" {% if budget.month == 5 %}selected{% endif %}>
                            May
                        </option>

                        <option value="6" {% if budget.month == 6 %}selected{% endif %}>
                            June
                        </option>

                        <option value="7" {% if budget.month == 7 %}selected{% endif %}>
                            July
                        </option>

                        <option value="8" {% if budget.month == 8 %}selected{% endif %}>
                            August
                        </option>

                        <option value="9" {% if budget.month == 9 %}selected{% endif %}>
                            September
                        </option>

                        <option value="10" {% if budget.month == 10 %}selected{% endif %}>
                            October
                        </option>

                        <option value="11" {% if budget.month == 11 %}selected{% endif %}>
                            November
                        </option>

                        <option value="12" {% if budget.month == 12 %}selected{% endif %}>
                            December
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="year">
                        Year
                    </label>

                    <input
                        type="number"
                        id="year"
                        name="year"
                        value="{{ budget.year }}"
                        min="2000"
                        required
                    >

                </div>

            </div>


            <div class="goal-form-actions">

                <a href="/budgets" class="form-cancel">
                    Cancel
                </a>

                <button
                    type="submit"
                    class="hero-button"
                >
                    Save Changes →
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
